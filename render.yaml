services:
  - type: web
    name: abl-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health

  - type: web
    name: abl-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: abl-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
